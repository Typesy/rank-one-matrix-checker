[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rank-one-research-checker"
version = "0.2.1"
description = "Exact finite-field rank-one basis checks with replayable evidence"
requires-python = ">=3.10"
dependencies = ["galois==0.4.11"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
rank-one-check = "rankone.cli:main"
rank-one-gui = "rankone.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rankone = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
